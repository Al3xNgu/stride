name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: SwiftLint (strict)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint --strict

  test:
    name: Build & test StridePackages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Runner-default Xcode on macos-15 satisfies Swift 5.10+; avoid pinning a
      # point release that may be pruned from the image.
      - name: Build
        working-directory: StridePackages
        run: swift build
      - name: Test
        working-directory: StridePackages
        run: swift test

  # The iOS app-target build job is added once StrideApp/.xcodeproj exists
  # (human one-time setup, see docs/ORCHESTRATION.md). It will run:
  #   xcodebuild -scheme Stride -destination 'platform=iOS Simulator,name=iPhone 16' build
